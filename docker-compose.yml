version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: opendedupe-db
    environment:
      POSTGRES_DB: opendedupe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opendedupe"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: opendedupe-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/opendedupe
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
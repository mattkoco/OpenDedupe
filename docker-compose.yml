version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - hf_model_cache:/app/hf_cache  # Persist Hugging Face models
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/opendedupe
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=opendedupe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d opendedupe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  hf_model_cache:  # Define the new volume for Hugging Face models      